<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стеллажи</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sansation+Light&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #212529;
        }

        .container {
            padding: 30px 50px;
            position: absolute;
            top: 157px;
            left: 0;
            right: 0;
            background: #FFFFFF;
        }

        .shelves-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .shelf-category {
            margin-bottom: 20px;
        }

        .shelf-category h2 {
            font-size: 18px;
            color: #9747FF;
            margin: 0 0 10px;
            cursor: pointer;
            position: relative;
        }

        .shelf-category h2::after {
            content: '▼';
            position: absolute;
            right: 0;
        }

        .shelf-list {
            display: none;
            list-style: none;
            padding: 0;
        }

        .shelf-list.active {
            display: block;
        }

        .shelf-list li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .shelf-list li a {
            text-decoration: none;
            color: #212529;
            font-size: 16px;
        }

        .add-shelf-btn {
            background: #9747FF;
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .add-shelf-btn:hover {
            background: #7a39d5;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .shelf-list li a {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .shelf-list li a {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    {% include 'header.html' %}
    <div class="container">
        <div class="shelves-container">
            <div class="shelf-category">
                <h2>Любовь и отношения</h2>
                <ul class="shelf-list">
                    <li><a href="#">Стеллаж 1</a></li>
                    <li><a href="#">Стеллаж 2</a></li>
                </ul>
            </div>
            <div class="shelf-category">
                <h2>Социальные отношения</h2>
                <ul class="shelf-list">
                    <li><a href="#">Стеллаж 1</a></li>
                    <li><a href="#">Стеллаж 2</a></li>
                    <li><a href="#">Стеллаж 3</a></li>
                </ul>
            </div>
            <div class="shelf-category">
                <h2>Приключения</h2>
                <ul class="shelf-list">
                    <li><a href="#">Стеллаж 1</a></li>
                    <li><a href="#">Стеллаж 2</a></li>
                    <li><a href="#">Стеллаж 3</a></li>
                </ul>
            </div>
            <div class="shelf-category">
                <h2>Виртуна</h2>
                <ul class="shelf-list">
                    <li><a href="#">Стеллаж 1</a></li>
                </ul>
            </div>
            <div class="shelf-category">
                <h2>Склад</h2>
                <ul class="shelf-list">
                    <li><a href="#">Стеллаж 1</a></li>
                </ul>
            </div>
            <button class="add-shelf-btn">+ Стеллаж</button>
        </div>
    </div>
    <script>
        document.querySelectorAll('.shelf-category h2').forEach(header => {
            header.addEventListener('click', () => {
                const shelfList = header.nextElementSibling;
                shelfList.classList.toggle('active');
            });
        });
    </script>
</body>
</html>
