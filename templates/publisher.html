{% extends 'base_admin.html' %}

{% block title %}Издательства{% endblock %}

{% block body %}
<div class="publishers-container">
    <div class="header-actions">
        <h2><i class="fas fa-building"></i> Издательства</h2>
        <a href="{{ url_for('add_publisher') }}" class="btn btn-add">
            <i class="fas fa-plus"></i> Добавить
        </a>
    </div>

    <table class="publishers-table">
        <thead>
            <tr>
                <th>Название</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for publisher in publishers %}
            <tr>
                <td>{{ publisher.name }}</td>
                <td class="actions">
                    <a href="{{ url_for('edit_publisher', publisher_id=publisher.id) }}"
                       class="btn btn-edit">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a href="{{ url_for('delete_publisher', publisher_id=publisher.id) }}"
                       class="btn btn-delete"
                       onclick="return confirm('Вы уверены?')">
                        <i class="fas fa-trash-alt"></i>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
