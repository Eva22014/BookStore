<link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
{% include 'header.html' %}

<div class="container">
    <div class="confirmation-card">
        <h1 class="confirmation-title">Подтверждение продажи</h1>

        <div class="total-section">
            <span class="total-label">Итого к оплате:</span>
            <span class="total-amount">{{ total }} ₽</span>
        </div>

        <div class="payment-section">
            <label class="payment-label">Способ оплаты:</label>
            <div class="custom-select">
                <select id="payment-method" class="payment-select">
                    <option value="cash">💵 Наличные</option>
                    <option value="card">💳 Банковская карта</option>
                    <option value="sbp">📱 СБП (Система быстрых платежей)</option>
                    <option value="qr">🔳 QR-код</option>
                </select>
                <span class="select-arrow">▼</span>
            </div>
        </div>

        <div class="action-buttons">
            <a href="{{ url_for('cart') }}" class="back-button">
                <span class="button-icon">←</span> Вернуться
            </a>
            <button id="confirm-sale" class="confirm-button">
                <span class="button-icon">✓</span> Подтвердить продажу
            </button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('confirm-sale').addEventListener('click', async function () {
            try {
                const paymentMethod = document.getElementById('payment-method').value;
                const cartId = "{{ cart_id }}";

                const response = await fetch("{{ url_for('process_payment') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        payment_method: paymentMethod,
                        cart_id: cartId
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP error! status: ${response.status}, text: ${errorText}`);
                }

                const data = await response.json();
                if (data.success) {
                    // Обновляем состояние корзины на главной после оплаты
                    document.querySelectorAll('.book-item').forEach(item => {
                        const bookId = item.getAttribute('data-book-id');
                        fetch(`/check_cart/${bookId}`)
                            .then(response => response.json())
                            .then(data => {
                                const quantity = data.quantity;
                                const cartControl = document.querySelector(`.cart-control[data-book-id="${bookId}"]`);
                                if (cartControl) {
                                    const addButton = cartControl.querySelector('.add-to-cart');
                                    const quantitySpan = cartControl.querySelector('.cart-quantity');
                                    quantitySpan.textContent = quantity;
                                    if (quantity === 0) {
                                        addButton.style.display = 'inline';
                                        quantitySpan.style.display = 'none';
                                    }
                                }
                            });
                    });
                    window.location.href = "{{ url_for('sale_success') }}";
                } else {
                    alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Произошла ошибка: ' + error.message);
            }
        });
    });
</script>
